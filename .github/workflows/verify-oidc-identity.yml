name: Verify lab OIDC identity

# Temporary bootstrap diagnostic; grants no AWS access and runs no PR code.
on:
  push:
    branches: [automation/git-events]
    paths: [.github/workflows/verify-oidc-identity.yml]

permissions: {}

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - name: Inspect only non-secret identity claims
        shell: python
        run: |
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          parsed = urllib.parse.urlsplit(url)
          query = urllib.parse.parse_qsl(parsed.query)
          query.append(('audience', 'sts.amazonaws.com'))
          url = urllib.parse.urlunsplit(parsed._replace(query=urllib.parse.urlencode(query)))
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          assert claims['iss'] == 'https://token.actions.githubusercontent.com'
          assert claims['aud'] == 'sts.amazonaws.com'
          assert claims['repository_id'] == '1359386091'
          assert claims['ref'] == 'refs/heads/automation/git-events'
          print(json.dumps({key: claims[key] for key in (
              'iss', 'aud', 'sub', 'repository_id', 'repository_owner_id', 'ref', 'event_name'
          )}, indent=2))
